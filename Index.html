<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Two Months ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:linear-gradient(135deg,#120012,#2a0934,#4b0039);
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
color:white;
}

.container{
width:90%;
max-width:700px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(10px);
padding:35px;
border-radius:25px;
text-align:center;
box-shadow:0 0 30px rgba(255,0,102,.3);
z-index:10;
position:relative;
}

.hidden{
display:none;
}

h1{
font-size:38px;
margin-bottom:10px;
color:#ffd700;
}

h2{
margin-bottom:20px;
font-weight:normal;
}

p{
font-size:18px;
line-height:1.8;
margin-bottom:25px;
}

button{
padding:15px 30px;
border:none;
border-radius:50px;
background:#ff2f74;
color:white;
font-size:18px;
cursor:pointer;
}

button:hover{
transform:scale(1.05);
}

input{
width:100%;
padding:15px;
border:none;
border-radius:10px;
margin:20px 0;
font-size:18px;
text-align:center;
}

#letter{
text-align:left;
height:60vh;
overflow:auto;
white-space:pre-wrap;
line-height:2;
font-size:18px;
}

.heart{
position:fixed;
bottom:-50px;
font-size:30px;
animation:float 8s linear infinite;
}

@keyframes float{

0%{
transform:translateY(0);
opacity:0;
}

20%{
opacity:1;
}

100%{
transform:translateY(-120vh);
opacity:0;
}

}

</style>

</head>

<body>

<div class="container">

<div id="page1">

<h1>❤️ Happy Two Months ❤️</h1>

<h2>For Benedict Lugard Clinton</h2>

<p>

Some people come into our lives...

and quietly change everything.

Thank you for changing mine.

</p>

<button onclick="nextPage()">

Open My Heart ❤️

</button>

</div>

<div id="page2" class="hidden">

<h1>🔒</h1>

<h2>This letter belongs to one person.</h2>

<input
id="password"
placeholder="Enter your name">

<button onclick="unlock()">

Unlock ❤️

</button>

</div>

<div id="page3" class="hidden">

<h1>My Dearest Benedict ❤️</h1>

<div id="letter"></div>

</div>

</div>
