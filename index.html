https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@300;400&display=swap<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Two Months ❤️</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
</head>

<body>

<div class="stars"></div>

<div class="container">

<div id="welcome" class="card">

<h1>❤️ Happy Two Months ❤️</h1>

<h2>For Benedict Lugard Clinton</h2>

<p>
Some people come into our lives and quietly change everything...
</p>

<button onclick="showPassword()">
Open My Heart ❤️
</button>

</div>

<div id="password" class="card hidden">

<h1>🔒</h1>

<h2>This letter belongs to one person.</h2>

<input
type="text"
id="passwordInput"
placeholder="Enter your name">

<button onclick="unlockLetter()">
Unlock ❤️
</button>

</div>

<div id="letter" class="card hidden">

<h1>My Dearest Benedict ❤️</h1>

<div id="typing"></div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
